<html lang="es"><head><meta charset="utf-8"><title>Robot Klase A · Audio paso a paso</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1000px;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#f5f8fd;color:#092045}.slide{position:relative;width:1600px;height:1000px;padding:42px 54px;background:linear-gradient(125deg,#f9fcff,#eff5ff)}.slide:before{content:"";position:absolute;top:-170px;right:-150px;width:570px;height:570px;background:#dfeeff;border-radius:50%;opacity:.6}.top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{font-size:20px;color:#1b71b8;letter-spacing:2px;font-weight:800;text-transform:uppercase}.title{font-size:62px;line-height:1.04;letter-spacing:-3px;margin:9px 0 9px;font-weight:900;max-width:1150px}.lead{font-size:25px;line-height:1.3;color:#475c78;margin:0}.badge{background:#d9f9ef;color:#08735b;border-radius:21px;padding:19px 25px;font-size:21px;font-weight:800;text-align:center;min-width:240px;box-shadow:0 8px 18px #06255512}.grid{position:relative;display:grid;gap:19px}.card{background:white;border:2px solid #dce8f7;border-radius:25px;box-shadow:0 12px 26px #0920450d;padding:25px}.blue{background:#e4f2ff;border-color:#bfdeff}.mint{background:#e1faef;border-color:#b6ebd3}.yellow{background:#fff3c0;border-color:#f8d66a}.rose{background:#ffe7e9;border-color:#ffb9c3}.card h2{font-size:28px;line-height:1.1;margin:0 0 13px;color:#103660}.card p{font-size:21px;line-height:1.36;margin:7px 0;color:#344a66}.strong{font-weight:800;color:#0a264a}.pill{display:inline-block;border-radius:999px;padding:9px 15px;background:#173b70;color:white;font-size:19px;font-weight:800}.num{display:inline-grid;place-items:center;width:43px;height:43px;border-radius:50%;background:#1276c3;color:white;font-weight:900;font-size:25px;margin-right:10px}.footer{position:absolute;bottom:20px;left:54px;right:54px;display:flex;justify-content:space-between;align-items:center;color:#6e819a;font-size:18px;font-weight:700}.warning{background:#fff0d9;color:#8a4616;border-left:8px solid #ee9b28;border-radius:17px;padding:15px 20px;font-size:21px;line-height:1.25;font-weight:800}.toolicon{font-size:61px;display:block;margin:9px 0 8px}.line{height:2px;background:#e5ecf6;margin:16px 0}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:16px 12px;border-radius:17px;background:#573293;width:100%;height:120px;align-items:end}.board span{height:33px;border-radius:6px;background:#ffe278;border:4px solid #352056;position:relative}.board span:after{content:"";display:block;position:absolute;width:7px;height:27px;background:#afb9c2;top:22px;left:50%;transform:translateX(-50%);border-radius:2px}.board.five{grid-template-columns:repeat(5,1fr)}.solder{display:flex;align-items:center;gap:12px;margin:15px 0}.solder .tip{width:110px;height:20px;background:linear-gradient(90deg,#273b50 35%,#aab7bd 36%,#d2d9dc 85%,#8c9294);clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%);transform:rotate(-18deg)}.solder .joint{width:28px;height:28px;border-radius:50%;background:linear-gradient(120deg,#fff,#a6b8c6);border:3px solid #6c8396}.solder .wire{width:100px;height:5px;background:#d98b3b;transform:rotate(15deg)}.stepsmall{font-size:18px!important}.map{border-collapse:collapse;width:100%;font-size:21px;background:white}.map td{border-bottom:2px solid #e4edf8;padding:9px}.map tr:last-child td{border:0}.map td:first-child{font-weight:800}.arrow{color:#1178c4;font-weight:900;text-align:center}.mini{font-size:18px;color:#63778f}.speaker{width:132px;height:132px;margin:auto;border-radius:50%;background:radial-gradient(circle,#8494a9 0 25%,#cfdae4 26% 38%,#4b5d72 39% 52%,#dce4ec 53% 65%,#7e91a4 66%);box-shadow:0 10px 20px #0002}
</style></head><body><div id="root"></div>
<script>
const p=new URLSearchParams(location.search).get('page')||'1';
const F='<div class="footer"><span>KLASE A · ROBOT DE PAÑOL · AUDIO</span><span>Página '+p+' de 3</span></div>';
let html='';
if(p==='1')html=`<div class="slide"><div class="top"><div><div class="eyebrow">Tutorial de audio · Paso 1</div><h1 class="title">¿Nunca soldaste? Empezá por acá</h1><p class="lead">Sí, se aprende rápido. Hacé una unión de práctica antes de tocar el micrófono.</p></div><div class="badge">20 minutos de práctica<br>sin apuro</div></div>
<div class="grid" style="grid-template-columns:1.05fr 1.05fr .9fr;margin-top:34px">
<div class="card"><h2>Prepará la mesa</h2><div class="toolicon">♨️</div><p><span class="strong">Necesitás:</span> soldador para electrónica, estaño con núcleo de flux, soporte para el soldador, esponja húmeda o lana de latón y pinza/cortacables.</p><p>Si tiene control de temperatura, empezá alrededor de <b>330–350 °C</b>. Trabajá con ventilación.</p></div>
<div class="card blue"><h2>La técnica en 4 movimientos</h2><div class="solder"><div class="tip"></div><div class="joint"></div><div class="wire"></div></div><p><span class="num">1</span> Apoyá la punta sobre <b>pin y aro metálico</b> a la vez.</p><p><span class="num">2</span> Acercá el estaño a la <b>unión caliente</b>, no a la punta.</p><p><span class="num">3</span> Retirá estaño; luego soldador. Son unos <b>2–3 segundos</b>.</p><p><span class="num">4</span> Dejá enfriar quieto. Queda una unión pequeña y firme.</p></div>
<div class="card yellow"><h2>Antes de la placa real</h2><p>Practicá con dos pines de una tira sobrante o una pieza vieja.</p><div class="line"></div><p>Soldá <b>un solo pin</b> del módulo. Comprobá que quedó derecho; recién después hacé los demás.</p><div class="line"></div><p>Si se unen dos pines con estaño, <b>no enchufes</b>: calentá el puente y quitá el excedente con malla desoldadora.</p></div></div>
<div class="warning" style="margin-top:24px">⚠️ USB desenchufado durante toda la soldadura. No toques la punta ni apoyes el soldador sobre la mesa. Nunca uses flux ácido de plomería.</div>${F}</div>`;
if(p==='2')html=`<div class="slide"><div class="top"><div><div class="eyebrow">Tutorial de audio · Paso 2</div><h1 class="title">Soldá estas tres piezas</h1><p class="lead">Las tiras y la bornera van fijas a sus placas. La protoboard sirve para sujetarlas mientras soldás.</p></div><div class="badge">USB desenchufado<br>todo el tiempo</div></div>
<div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:38px">
<div class="card"><span class="pill">1 · MICRÓFONO</span><h2 style="margin-top:15px">MAX9814: 5 pines</h2><div class="board five"><span></span><span></span><span></span><span></span><span></span></div><p>Meté los extremos largos de la tira negra en la protoboard. Poné el módulo sobre los extremos cortos.</p><p><b>Soldá los 5 agujeros</b> del borde. Dejá visible la cara del micrófono.</p></div>
<div class="card"><span class="pill">2 · AMPLIFICADOR</span><h2 style="margin-top:15px">MAX98357A: 7 pines</h2><div class="board"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><p>Usá la tira amarilla de <b>7 pines</b> en los siete agujeros pequeños del borde.</p><p>Soldá uno, enderezá la placa y soldá los otros seis.</p></div>
<div class="card"><span class="pill">3 · PARLANTE</span><h2 style="margin-top:15px">Bornera verde + cables</h2><div class="speaker"></div><p>La <b>bornera verde</b> entra en los dos agujeros grandes del amplificador: soldá sus dos patas.</p><p>Al parlante, soldale dos cables en sus terminales. Sujetá las puntas libres en los bornes <b>+ y −</b>.</p></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:21px"><div class="card mint"><h2>Así debe quedar</h2><p>Estaño brillante y pequeño alrededor de cada pin. La placa queda recta y los pines no se mueven.</p></div><div class="card rose"><h2>Revisá antes de energizar</h2><p>Que no haya bolitas sueltas ni puentes de estaño entre agujeros vecinos. El parlante nunca toca GND de la ESP32.</p></div></div>${F}</div>`;
if(p==='3')html=`<div class="slide"><div class="top"><div><div class="eyebrow">Tutorial de audio · Paso 3</div><h1 class="title">Conectá el audio a la ESP32</h1><p class="lead">Seguí las etiquetas impresas, no el color de los cables. La pantalla y el botón quedan como están.</p></div><div class="badge">Primero revisar<br>después enchufar</div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;gap:25px;margin-top:31px">
<div class="card"><h2>🎙️ Micrófono MAX9814</h2><table class="map"><tr><td>V+</td><td class="arrow">→</td><td>3V3</td></tr><tr><td>GND</td><td class="arrow">→</td><td>GND común</td></tr><tr><td>OUT</td><td class="arrow">→</td><td>GPIO1</td></tr></table><p class="mini">Los pines G/GAIN y AR quedan libres. Nunca alimentes este micrófono con 5 V en este montaje.</p></div>
<div class="card"><h2>🔊 Amplificador MAX98357A</h2><table class="map"><tr><td>VIN</td><td class="arrow">→</td><td>5V/VBUS*</td></tr><tr><td>GND</td><td class="arrow">→</td><td>GND común</td></tr><tr><td>LRC</td><td class="arrow">→</td><td>GPIO4</td></tr><tr><td>BCLK</td><td class="arrow">→</td><td>GPIO5</td></tr><tr><td>DIN</td><td class="arrow">→</td><td>GPIO6</td></tr></table><p class="mini">GAIN y SD quedan libres. El parlante va solamente entre + y − de la bornera verde.</p></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;gap:25px;margin-top:20px"><div class="card blue"><h2>¿Cómo compartir 3V3 y GND?</h2><p>Usá los rieles de la protoboard como distribuidores: <b>3V3 → riel positivo</b>; <b>GND → riel negativo</b>. Ahí conectás el micrófono y los cables que ya alimentan la pantalla. No apiles conectores sobre un mismo pin.</p></div><div class="card yellow"><h2>* Freno antes de VIN</h2><p>Identificá el pin <b>5V/VBUS</b> de tu ESP32 cerca del USB. Si no se lee con claridad, no conectes VIN todavía: mandá foto nítida para verificarlo. Nunca lleves 5 V a GPIO1, GPIO4, GPIO5 o GPIO6.</p></div></div>
<div class="warning" style="margin-top:18px">📷 Sacá una foto del frente y otra de atrás del montaje antes de conectar el USB. Revisamos los cables y luego cargamos la prueba de sonido.</div>${F}</div>`;
document.getElementById('root').innerHTML=html;
</script></body></html>
